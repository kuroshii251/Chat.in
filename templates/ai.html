<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">    <style>
        :root {
            --bg: #08080f;
            --surface: #0e0e1a;
            --surface2: #13131f;
            --border: rgba(255,255,255,0.06);
            --text: #ededf5;
            --muted: #5a5a7a;
            --radius: 20px;
            --accent: #c084fc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { width: 400px; height: 400px; top: -100px; right: -100px; background: var(--char-glow, rgba(192,132,252,0.07)); }
        .blob-2 { width: 300px; height: 300px; bottom: 60px; left: -80px; background: rgba(236,72,153,0.05); }

        /* Topbar */
        .topbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,8,15,0.8);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .back-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            text-decoration: none;
        }
        .back-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
        .back-btn svg { width: 16px; height: 16px; }

        .char-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .char-info { flex: 1; min-width: 0; }
        .char-info-name {
            font-family: 'Syne', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .char-info-tag {
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            flex-shrink: 0;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.72rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .reset-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

        /* Chat */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }
        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-emoji {
            font-size: 3.5rem;
            animation: float 3s ease-in-out infinite;
            line-height: 1;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .empty-state h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-top: 8px;
        }
        .empty-state p { font-size: 0.82rem; line-height: 1.55; font-weight: 300; }

        /* Starter chips */
        .starters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        .starter-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 0.75rem;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .starter-chip:hover {
            border-color: rgba(255,255,255,0.15);
            color: var(--text);
            background: var(--surface2);
        }

        /* Messages */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: msgIn 0.3s ease;
        }

        .char-avatar img,
.msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            align-self: flex-end;
        }
        .msg.user .msg-avatar {
            background: linear-gradient(135deg, rgba(192,132,252,0.3), rgba(236,72,153,0.3));
            border-color: rgba(192,132,252,0.2);
        }

        .msg-body { max-width: min(75%, 480px); }
        .msg-name {
            font-size: 0.65rem;
            color: var(--muted);
            margin-bottom: 5px;
            letter-spacing: 0.04em;
            font-weight: 500;
        }
        .msg.user .msg-name { text-align: right; }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.875rem;
            line-height: 1.65;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg.user .bubble {
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px 4px 16px 16px;
        }
        .msg.ai .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--char-accent, var(--accent));
            border-radius: 4px 16px 16px 16px;
        }

        /* Typing */
        .typing-indicator {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 2px solid var(--char-accent, var(--accent));
            border-radius: 4px 16px 16px 16px;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--char-accent, var(--accent));
            animation: bounce 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* System msg */
        .sys-msg {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            padding: 5px 14px;
            background: rgba(255,255,255,0.02);
            border-radius: 100px;
            align-self: center;
        }

        /* Input */
        .input-wrapper {
            position: relative;
            z-index: 10;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            background: rgba(8,8,15,0.8);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }
        .input-inner {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 10px 10px 16px;
            transition: border-color 0.2s;
        }
        .input-inner:focus-within { border-color: rgba(192,132,252,0.25); }

        #message {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            resize: none;
            line-height: 1.5;
            max-height: 120px;
        }
        #message::placeholder { color: var(--muted); }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--char-accent, #c084fc), rgba(192,132,252,0.6));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        /* max width wrapper for chat content */
        .chat-inner {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (max-width: 480px) {
            .chat-area { padding: 16px 14px; }
            .msg-body { max-width: 82%; }
        }

        
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- Topbar -->
<div class="topbar">
    <a href="/" class="back-btn" title="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
<div class="char-avatar">
    <img id="charAvatar" src="" alt="avatar">
</div>    <div class="char-info">
        <div class="char-info-name" id="charName">Waguri Tsumugi</div>
        <div class="char-info-tag" id="charTag">Waifu • Sweet</div>
    </div>
    <div class="status-dot"></div>
    <button class="reset-btn" onclick="resetChat()">Reset</button>
</div>

<!-- Chat -->
<div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
        <div class="empty-state" id="emptyState">
            <div class="empty-emoji" id="emptyEmoji">🌸</div>
            <h2 id="emptyTitle">Halo! Gw siap ngobrol~</h2>
            <p id="emptyDesc">Kirim pesan pertama lo, atau coba salah satu topik di bawah.</p>
            <div class="starters" id="starters"></div>
        </div>
    </div>
</div>

<!-- Input -->
<div class="input-wrapper">
    <div class="input-inner">
        <textarea id="message" rows="1" placeholder="Ketik pesanmu..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
const CHARS = {
    waguri: {
        name: "Waguri Tsumugi", emoji: "🌸", avatar:"/static/avatar/waguri.png", tag: "Waifu",
        accent: "#f9a8d4", glow: "rgba(249,168,212,0.07)",
        starters: ["Rekomendasi kue enak dong~", "Hari ini kamu ngapain?", "Cerita dong tentang dirimu!"]
    },
    naruto: {
        name: "Naruto Uzumaki", avatar:"/static/avatar/naruto.png",  emoji: "", tag: "Shinobi",
        accent: "#fb923c", glow: "rgba(251,146,60,0.07)",
        starters: ["Jurus andalanmu apa?", "Gimana jadi Hokage?", "Siapa teman terbaikmu?"]
    },
    jungkook: {
        name: "Jungkook", avatar:"/static/avatar/jungkook.png",  emoji: "", tag: "BTS",
        accent: "#a78bfa", glow: "rgba(167,139,250,0.07)",
        starters: ["Lagi dengerin lagu apa?", "Rekomendasiin game dong!", "Favorite food lo apa?"]
    },
    suga: {
        name: "Suga (Yoongi)", avatar:"/static/avatar/suga.png",  emoji: "", tag: "BTS",
        accent: "#94a3b8", glow: "rgba(148,163,184,0.07)",
        starters: ["Share quote favorit lo dong", "Lagi bikin lagu apa?", "Gimana cara lo ngilangin stress?"]
    }, 
    leon: {
    name: "Leon Scott Kennedy",
    avatar: "/static/avatar/leon.png",
    emoji: "🖤",
    tag: "Calm • Survivor • Protective",
    description: "Tetap tenang di tengah kekacauan. Terlihat dingin, tapi selalu jadi orang pertama yang melindungi.",
    accent: "#94a3b8",
    glow: "rgba(148,163,184,0.07)",
    starters: [
        "Kalau dunia lagi kacau, biasanya lo ngapain?",
        "Ada hal yang masih bikin lo bertahan sampai sekarang?",
        "Menurut lo, seseorang bisa tetap kuat sampai kapan?"
    ]
},

elaina: {
    name: "Elaina",
    avatar: "/static/avatar/elaina.png",
    emoji: "",
    tag: "Free Spirit • Traveler • Mysterious",
    description: "Bebas seperti angin, berjalan tanpa terikat apa pun. Tenang, penasaran, dan penuh cerita.",
    accent: "#94a3b8",
    glow: "rgba(148,163,184,0.07)",
    starters: [
        "Kalau bisa pergi ke mana aja sekarang, lo mau ke mana?",
        "Menurut lo, perjalanan lebih penting dari tujuan?",
        "Ceritain tempat yang paling pengen lo kunjungin dong"
    ]
},

alya: {
    name: "Alya",
    avatar: "/static/avatar/alya.png",
    emoji: "",
    tag: "Cold Outside • Soft Inside",
    description: "Kalem di luar, hangat di dalam. Jarang banyak bicara, tapi selalu punya makna.",
    accent: "#94a3b8",
    glow: "rgba(148,163,184,0.07)",
    starters: [
        "Lo lebih suka nunjukin rasa sayang secara langsung atau diam-diam?",
        "Ada lagu yang akhir-akhir ini sering lo puter?",
        "Menurut lo, kenapa seseorang susah jujur soal perasaan?"
    ]
},
};

const params = new URLSearchParams(location.search);
const role = params.get('role') || 'waguri';
const char = CHARS[role] || CHARS['waguri'];

document.documentElement.style.setProperty('--char-accent', char.accent);
document.querySelector('.blob-1').style.background = char.glow;

document.getElementById('charAvatar').src = char.avatar;
document.getElementById('charName').textContent = char.name;
document.getElementById('charTag').textContent = char.tag;
document.getElementById('emptyEmoji').textContent = char.emoji;
document.getElementById('emptyTitle').textContent = `Halo! Gw ${char.name.split(' ')[0]}~`;
document.getElementById('sendBtn').style.background = `linear-gradient(135deg, ${char.accent}, ${char.accent}99)`;
document.title = `Chat dengan ${char.name} ✦`;

const startersEl = document.getElementById('starters');
char.starters.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'starter-chip';
    chip.textContent = s;
    chip.onclick = () => {
        document.getElementById('message').value = s;
        sendMessage();
    };
    startersEl.appendChild(chip);
});

let isTyping = false;

function escHtml(t) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(t));
    return d.innerHTML;
}

function removeEmpty() {
    const e = document.getElementById('emptyState');
    if (e) e.remove();
}

function appendMsg(role, content, name, emoji) {
    removeEmpty();
    const inner = document.getElementById('chatInner');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    if (role === 'user') {
        div.innerHTML = `
            <div class="msg-avatar">👤</div>
            <div class="msg-body">
                <div class="msg-name">Kamu</div>
                <div class="bubble">${escHtml(content)}</div>
            </div>`;
    } else {
        div.innerHTML = `
<div class="msg-avatar">
    <img src="${char.avatar}" alt="${char.name}">
</div>            <div class="msg-body">
                <div class="msg-name">${escHtml(name || 'AI')}</div>
                <div class="bubble">${escHtml(content)}</div>
            </div>`;
    }

    inner.appendChild(div);
    scrollToBottom();
}

function showTyping() {
    removeEmpty();
    const inner = document.getElementById('chatInner');
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typingIndicator';
    div.innerHTML = `
<div class="msg-avatar">
    <img src="${char.avatar}" alt="${char.name}">
</div>        <div class="typing-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>`;
    inner.appendChild(div);
    scrollToBottom();
}

function hideTyping() {
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
}

function scrollToBottom() {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
}

function appendSys(msg) {
    const inner = document.getElementById('chatInner');
    const div = document.createElement('div');
    div.className = 'sys-msg';
    div.textContent = msg;
    inner.appendChild(div);
    scrollToBottom();
}

async function sendMessage() {
    if (isTyping) return;
    const input = document.getElementById('message');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    input.style.height = 'auto';
    isTyping = true;
    document.getElementById('sendBtn').disabled = true;

    appendMsg('user', message);
    showTyping();

    try {
        const resp = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role, message })
        });
        const data = await resp.json();
        hideTyping();

        if (data.reply) {
            appendMsg('ai', data.reply, data.name, data.emoji);
        } else {
            appendMsg('ai', `❌ Error: ${data.error || 'Unknown error'}`, 'System', '⚠️');
        }
    } catch (err) {
        hideTyping();
        appendMsg('ai', `❌ Gagal konek ke server: ${err.message}`, 'System', '⚠️');
    }

    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}

async function resetChat() {
    await fetch('/reset');
    const inner = document.getElementById('chatInner');
    inner.innerHTML = '';
    appendSys('💬 Memory di-reset');
    setTimeout(() => {
        inner.innerHTML = `
            <div class="empty-state" id="emptyState">
                <div class="empty-emoji">${char.emoji}</div>
                <h2>Chat di-reset~</h2>
                <p>Mulai percakapan baru!</p>
            </div>`;
    }, 1500);
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
